name: hive-online

# This file is uploaded to /home/pi/portainer_data/hive/docker-compose.yml.
# Source code lives in ./site; persistent state lives in ./data and ./config.
services:
  hive:
    build:
      context: ./site
    image: hive-online:latest
    container_name: hive
    restart: unless-stopped
    init: true
    ports:
      - "${HIVE_PORT:-8085}:3000"
    environment:
      NODE_ENV: production
      PUBLIC_URL: "${PUBLIC_URL:-http://homebridge.local:8085}"
      TRUST_PROXY: "${TRUST_PROXY:-false}"
      SESSION_DAYS: "${SESSION_DAYS:-30}"
      TZ: "${TZ:-Europe/London}"
      MAIL_MODE: "${MAIL_MODE:-smtp}"
      SMTP_HOST: "${SMTP_HOST:-mailpit}"
      SMTP_PORT: "${SMTP_PORT:-1025}"
      SMTP_SECURE: "${SMTP_SECURE:-false}"
      SMTP_ALLOW_NO_AUTH: "${SMTP_ALLOW_NO_AUTH:-true}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-admin@parkm8.com}"
      ZEPTOMAIL_API_URL: "${ZEPTOMAIL_API_URL:-https://api.zeptomail.eu/v1.1/email}"
      ZEPTOMAIL_TOKEN: "${ZEPTOMAIL_TOKEN:-}"
      OLLAMA_ENABLED: "${OLLAMA_ENABLED:-true}"
      OLLAMA_URL: "${OLLAMA_URL:-http://192.168.1.148:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-llama3.1:8b}"
      OLLAMA_TIMEOUT_MS: "${OLLAMA_TIMEOUT_MS:-12000}"
      BOT_MIN_DELAY_MS: "${BOT_MIN_DELAY_MS:-900}"
      BOT_DIFFICULTY: "${BOT_DIFFICULTY:-auto}"
    volumes:
      - ./data:/data
      - ./config:/config
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # Local SMTP sink so verification e-mails can be tested without a real
  # provider. Inbox: http://<host>:8025. Set MAIL_MODE=zeptomail to deliver
  # real mail instead.
  mailpit:
    image: axllent/mailpit:latest
    container_name: hive-mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: "500"
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
