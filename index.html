<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f0e2" />
    <meta
      name="description"
      content="Hive Online — play the classic two-player tile game live, with invite codes, ranked play and a pass-and-play mode."
    />
    <script>
      // Apply the saved theme before the first paint to avoid a flash.
      (() => {
        try {
          const stored = localStorage.getItem('hive-theme');
          const theme = stored === 'light' || stored === 'dark' ? stored : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Hive Online</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
